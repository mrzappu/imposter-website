services:
  - type: web
    name: imposter-website
    runtime: node
    repo: https://github.com/yourusername/your-repo
    plan: free
    region: oregon
    buildCommand: npm install && npm run generate-qr
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DISCORD_BOT_TOKEN
        sync: false  # Set this manually in Render dashboard
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        value: https://your-domain.onrender.com/auth/discord/callback
      - key: LOGIN_LOG_CHANNEL
        sync: false
      - key: PAYMENT_LOG_CHANNEL
        sync: false
      - key: APPROVED_LOG_CHANNEL
        sync: false
      - key: AUTO_ROLE_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: BASE_URL
        value: https://your-domain.onrender.com
      - key: ADMIN_DISCORD_ID
        sync: false
      - key: UPI_ID
        sync: false
      - key: PAYMENT_NOTE
        value: IMPOSTER Network Payment
      - key: DEFAULT_AMOUNT
        value: 19.99
