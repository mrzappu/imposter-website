services:
  - type: web
    name: imposter-network
    runtime: node
    repo: https://github.com/YOUR_USERNAME/imposter-network
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: LOGIN_LOG_CHANNEL
        sync: false
      - key: PAYMENT_LOG_CHANNEL
        sync: false
      - key: APPROVED_LOG_CHANNEL
        sync: false
      - key: AUTO_ROLE_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: BASE_URL
        sync: false
      - key: ADMIN_DISCORD_ID
        sync: false
